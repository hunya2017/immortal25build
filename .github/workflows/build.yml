name: immortalwrt-r3s

on:
  schedule:
    # 每周五北京时间 02:00（UTC+8）运行
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      jobs:
        description: Number of parallel build jobs
        required: false
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Check source tree
        run: |
          test -f Makefile || { echo "No Makefile found at repository root; this workflow expects an ImmortalWrt source tree."; exit 1; }
          test -f feeds.conf.default || { echo "No feeds.conf.default found at repository root."; exit 1; }

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: make defconfig

      - name: Download sources
        run: make download

      - name: Compile
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          [[ "$JOBS" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "jobs must be an integer from 1 to 999"; exit 1; }
          make -j"$JOBS" V=s

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-${{ github.sha }}
          path: |
            bin/targets/**
            bin/packages/**
          if-no-files-found: warn
          retention-days: 14
