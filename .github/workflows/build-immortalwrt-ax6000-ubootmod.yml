name: ImmortalWrt 25.12 SSH 自定义设备编译

on:
  schedule:
    - cron: '0 18 * * 5' # 每周五北京时间凌晨 2 点
  watch:
    types: [started]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 启动 SSH 调试会话
        required: false
        default: false
        type: boolean
      CACHE_BUILD:
        description: 启用编译缓存
        required: false
        default: true
        type: boolean
      UPLOAD_FIRMWARE:
        description: 上传固件
        required: true
        default: true
        type: boolean
      UPLOAD_APP:
        description: 上传应用包（APK）
        required: true
        default: true
        type: boolean
      USE_PREVIOUS_CONFIG:
        description: 复用上一次成功编译的配置
        required: false
        default: true
        type: boolean
      UPLOAD_RELEASE:
        description: 发布固件到 GitHub Releases
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  DIY_P1_SH: smpackage/immortalwrt-ax6000-ubootmod-1.sh
  DIY_P2_SH: smpackage/immortalwrt-ax6000-ubootmod-2.sh
  SETTINGS_PATCH: smpackage/settings-ax6000-ubootmod.patch

jobs:
  build:
    name: Build ImmortalWrt for ${{ matrix.name }}
    outputs:
      device_name: ${{ steps.select-device.outputs.device_name }}
      device_slug: ${{ steps.select-device.outputs.device_slug }}
    if: (github.event_name != 'watch' && github.event_name != 'repository_dispatch') || github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ax6000-ubootmod
            name: SSH 自定义设备（默认 AX6000 U-Bootmod）
            config_file: config/immortalwrt-ax6000-ubootmod.info
            target_board: mediatek
            target_subtarget: filogic
            target_device: xiaomi_redmi-router-ax6000-ubootmod
            target_profile: DEVICE_xiaomi_redmi-router-ax6000-ubootmod
    env:
      DEVICE_SLUG: ${{ matrix.slug }}
      CONFIG_ARTIFACT_SLUG: ${{ matrix.slug }}
      DEVICE_NAME: ${{ matrix.name }}
      CONFIG_FILE: ${{ matrix.config_file }}
      TARGET_BOARD: ${{ matrix.target_board }}
      TARGET_SUBTARGET: ${{ matrix.target_subtarget }}
      TARGET_DEVICE: ${{ matrix.target_device }}
      TARGET_PROFILE: ${{ matrix.target_profile }}
    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4

      - name: 查找上一次成功编译的配置
        id: previous-config
        if: github.event_name != 'workflow_dispatch' || inputs.USE_PREVIOUS_CONFIG == true
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'build-immortalwrt-ax6000-ubootmod.yml';
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: context.ref_name,
              status: 'success',
              per_page: 20
            });

            for (const run of runs.workflow_runs) {
              if (run.id === context.runId) continue;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              const wantedName = 'immortalwrt-custom-device-buildinfo';
              const configArtifact = data.artifacts.find(artifact =>
                artifact.name === wantedName && !artifact.expired
              );
              if (configArtifact) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('artifact_name', configArtifact.name);
                core.info(`将复用运行 ${run.id} 的编译配置`);
                return;
              }
            }

            core.info('没有找到可复用的成功编译配置，将使用仓库内配置或空配置');

      - name: 下载上一次成功编译的配置
        if: steps.previous-config.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous-config.outputs.artifact_name }}
          path: previous-buildinfo
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-config.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-dev python3-pyelftools python3-setuptools rsync unzip zlib1g-dev file wget ccache

      - name: 设置编译时间
        run: echo "BUILD_DATE=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"

      - name: 下载 ImmortalWrt 源码
        run: git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: 执行自定义脚本一
        run: |
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            (cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH")
          fi

      - name: 更新并安装软件源
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 从 APK 在线源列表排除 iStore 源
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("include/feeds.mk")
          source = path.read_text(encoding="utf-8")
          start = source.index("define FeedSourcesAppendAPK")
          end = source.index("\nendef", start)
          block = source[start:end]
          old = "$(foreach feed,$(FEEDS_AVAILABLE),"
          new = "$(foreach feed,$(filter-out istore,$(FEEDS_AVAILABLE)),"
          if block.count(old) != 1:
              raise SystemExit("无法唯一定位 APK feed 列表生成逻辑，停止修改")
          source = source[:start] + block.replace(old, new, 1) + source[end:]
          path.write_text(source, encoding="utf-8")
          print("保留 iStore 编译 feed；从固件在线 APK 源列表中排除 istore")
          PY

      - name: 准备编译缓存目录
        run: mkdir -p openwrt/dl openwrt/.ccache

      - name: 恢复编译缓存
        if: github.event_name != 'workflow_dispatch' || inputs.CACHE_BUILD == true
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: immortalwrt-25.12-${{ matrix.slug }}-${{ hashFiles('smpackage/immortalwrt-ax6000-ubootmod-1.sh', 'smpackage/immortalwrt-ax6000-ubootmod-2.sh', matrix.config_file) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortalwrt-25.12-${{ matrix.slug }}-${{ hashFiles('smpackage/immortalwrt-ax6000-ubootmod-1.sh', 'smpackage/immortalwrt-ax6000-ubootmod-2.sh', matrix.config_file) }}-
            immortalwrt-25.12-${{ matrix.slug }}-

      - name: 清理 Go 模块缓存
        working-directory: openwrt
        run: |
          module_cache="dl/go-mod-cache"
          if [ -d "$module_cache" ]; then
            rm -rf "$module_cache"
            echo "已清理 Go 模块缓存，将在编译时重新下载；保留其他下载缓存与 ccache"
          else
            echo "未发现 Go 模块缓存，跳过清理"
          fi

      - name: 设置设备编译配置
        run: |
          previous_config="previous-buildinfo/immortalwrt-${DEVICE_SLUG}.config"
          if [ -f "$previous_config" ]; then
            cp "$previous_config" openwrt/.config
            echo "已载入上一次成功编译的 .config"
          elif [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" openwrt/.config
            echo "已载入仓库中的 $CONFIG_FILE"
          else
            : > openwrt/.config
            echo "未找到 $CONFIG_FILE，已创建空 .config"
          fi
          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            (cd openwrt && "$GITHUB_WORKSPACE/$DIY_P2_SH")
          fi

      - name: 设置默认设备并初始化配置
        working-directory: openwrt
        run: |
          if ! grep -Eq '^CONFIG_TARGET_[^=]+_DEVICE_[^=]+=y$' .config; then
            cat >> .config <<EOF
          CONFIG_TARGET_${TARGET_BOARD}=y
          CONFIG_TARGET_${TARGET_BOARD}_${TARGET_SUBTARGET}=y
          CONFIG_TARGET_${TARGET_BOARD}_${TARGET_SUBTARGET}_DEVICE_${TARGET_DEVICE}=y
          CONFIG_TARGET_BOARD="${TARGET_BOARD}"
          CONFIG_TARGET_SUBTARGET="${TARGET_SUBTARGET}"
          CONFIG_TARGET_PROFILE="${TARGET_PROFILE}"
          EOF
            echo '配置未指定设备，使用 AX6000 U-Bootmod 作为默认目标；可在 SSH 会话中更改。'
          else
            echo '沿用配置文件中的设备选择；可在 SSH 会话中更改。'
          fi
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: 开启 SSH 调试会话
        if: (github.event_name == 'workflow_dispatch' && inputs.ssh == true) || (github.event_name == 'repository_dispatch' && github.event.action == 'ssh')
        timeout-minutes: 40
        run: |
          set -euo pipefail
          upterm_version="v0.33.0"
          install_dir="$RUNNER_TEMP/upterm"
          archive="$RUNNER_TEMP/upterm-linux-amd64.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/owenthereal/upterm/releases/download/${upterm_version}/upterm_linux_amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$install_dir" upterm
          chmod +x "$install_dir/upterm"
          echo 'SSH 会话连接后执行：cd openwrt && make menuconfig；选择 Target System、Subtarget 和 Target Profile，保存 .config 后退出 menuconfig，再退出 SSH 会话即可继续编译。'
          session_json="$RUNNER_TEMP/upterm-session.json"
          "$install_dir/upterm" host \
            --detach \
            --accept \
            --output json \
            --skip-host-key-check \
            --authorized-keys "$GITHUB_WORKSPACE/.github/upterm-authorized-keys" \
            --join-timeout 40m > "$session_json"
          session_name="$(jq -er '.name' "$session_json")"
          ssh_command="$(jq -er '.sshCommand' "$session_json")"
          cleanup_upterm() {
            "$install_dir/upterm" session stop "$session_name" >/dev/null 2>&1 || true
          }
          trap cleanup_upterm EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          echo "Upterm SSH command: $ssh_command"
          "$install_dir/upterm" session wait "$session_name"

      - name: 规范化 SSH 设备选择并下载源码包
        id: select-device
        working-directory: openwrt
        run: |
          make defconfig
          mapfile -t selected_devices < <(grep -E '^CONFIG_TARGET_[^=]+_DEVICE_[^=]+=y$' .config || true)
          if [ "${#selected_devices[@]}" -ne 1 ]; then
            echo "设备选择无效：期望且仅期望一个 CONFIG_TARGET_*_DEVICE_*，实际找到 ${#selected_devices[@]} 个。"
            printf '%s\n' "${selected_devices[@]}"
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true
            exit 1
          fi
          selected_symbol="${selected_devices[0]%%=y}"
          selected_device="${selected_symbol##*_DEVICE_}"
          selected_slug="$(printf '%s' "$selected_device" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          selected_name="$(printf '%s' "$selected_device" | tr '_-' '  ' | awk '{ for (i = 1; i <= NF; i++) $i = toupper(substr($i, 1, 1)) substr($i, 2); print }')"
          echo "所选设备：$selected_symbol"
          echo "DEVICE_SLUG=$selected_slug" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=$selected_name" >> "$GITHUB_ENV"
          echo "TARGET_DEVICE=$selected_device" >> "$GITHUB_ENV"
          echo "device_slug=$selected_slug" >> "$GITHUB_OUTPUT"
          echo "device_name=$selected_name" >> "$GITHUB_OUTPUT"
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: 应用 AX6000 U-Bootmod 默认设置
        env:
          SETTINGS_PATCH: ${{ github.workspace }}/${{ env.SETTINGS_PATCH }}
        working-directory: openwrt
        run: |
          if [ "$TARGET_DEVICE" != 'xiaomi_redmi-router-ax6000-ubootmod' ]; then
            echo "所选设备为 $TARGET_DEVICE，跳过 AX6000 专用默认设置补丁"
            exit 0
          fi
          target="package/emortal/default-settings/files/99-default-settings"
          if [ ! -f "$SETTINGS_PATCH" ]; then
            echo "未找到 AX6000 自定义设置脚本，跳过：$SETTINGS_PATCH"
            exit 0
          fi
          if [ ! -f "$target" ]; then
            echo "错误：ImmortalWrt 默认设置脚本不存在：$target"
            exit 1
          fi
          python3 - "$target" "$SETTINGS_PATCH" <<'PY'
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          custom = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          source = target.read_text(encoding="utf-8")
          marker = "# === 自定义设置开始 ==="
          if marker in source:
              print("默认设置中已存在自定义设置，跳过重复注入")
              raise SystemExit(0)
          if "exit 0" not in source:
              raise SystemExit("默认设置脚本中未找到 exit 0，无法安全注入")
          source = source.replace("exit 0", f"\n{marker}\n{custom.rstrip()}\n\nexit 0", 1)
          target.write_text(source, encoding="utf-8")
          print(f"已将 AX6000 自定义设置注入 {target}")
          PY

      - name: 编译固件和应用包
        working-directory: openwrt
        run: |
          echo "CPU threads: $(nproc)"
          make -j"$(nproc)" || make -j1 V=s
          test -d bin/targets || { echo 'No firmware output was generated'; exit 1; }

      - name: 整理固件和 APK 应用包
        working-directory: openwrt
        run: |
          mkdir -p artifact/firmware artifact/buildinfo
          find bin/targets -type f -not -path '*/packages/*' -exec cp -t artifact/firmware {} +
          cp .config "artifact/buildinfo/immortalwrt-${CONFIG_ARTIFACT_SLUG}.config"
          cp feeds.conf.default artifact/buildinfo/
          mkdir -p artifact/apps
          find bin/packages bin/targets -type f -name '*.apk' -exec cp -t artifact/apps {} + 2>/dev/null || true
          if [ -d artifact/apps ] && [ -n "$(find artifact/apps -type f -print -quit)" ]; then
            tar -czf "artifact/immortalwrt-${DEVICE_SLUG}-apk-packages-${BUILD_DATE}.tar.gz" -C artifact/apps .
          else
            echo 'No APK application packages were generated.'
          fi
          mkdir -p artifact/release
          cp -a artifact/firmware/. artifact/release/
          if compgen -G "artifact/immortalwrt-${DEVICE_SLUG}-apk-packages-*.tar.gz" > /dev/null; then
            cp artifact/immortalwrt-${DEVICE_SLUG}-apk-packages-*.tar.gz artifact/release/
          fi

      - name: 上传固件
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.UPLOAD_FIRMWARE == true)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ steps.select-device.outputs.device_slug }}-firmware-${{ env.BUILD_DATE }}
          path: openwrt/artifact/firmware/*
          if-no-files-found: warn
          retention-days: 30

      - name: 上传应用包（APK）
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.UPLOAD_APP == true)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ steps.select-device.outputs.device_slug }}-apk-packages-${{ env.BUILD_DATE }}
          path: openwrt/artifact/immortalwrt-*-apk-packages-*.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译配置
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-custom-device-buildinfo
          path: openwrt/artifact/buildinfo/*
          if-no-files-found: warn
          retention-days: 90

      - name: 保存 Release 文件
        if: success() && github.event_name == 'workflow_dispatch' && inputs.UPLOAD_RELEASE == true
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ steps.select-device.outputs.device_slug }}-release-${{ github.run_id }}
          path: openwrt/artifact/release/*
          if-no-files-found: error
          retention-days: 1

  save_config:
    name: 保存 .config 到仓库
    needs: build
    if: success()
    runs-on: ubuntu-22.04
    concurrency:
      group: immortalwrt-device-config-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 检出当前分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 下载本次编译配置
        uses: actions/download-artifact@v4
        with:
          pattern: immortalwrt-*-buildinfo
          path: generated-buildinfo

      - name: 提交更新后的配置
        run: |
          mkdir -p config
          for slug in ax6000-ubootmod; do
            source_config="generated-buildinfo/immortalwrt-custom-device-buildinfo/immortalwrt-${slug}.config"
            target_config="config/immortalwrt-${slug}.info"
            test -s "$source_config" || { echo "编译配置文件为空或不存在：$source_config"; exit 1; }
            # 设备目标由编译脚本和 workflow 在构建时设置，不写回可复用的 .info 配置。
            target_board="$(sed -n 's/^CONFIG_TARGET_BOARD="\([^"]*\)"$/\1/p' "$source_config" | head -1)"
            target_subtarget="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\([^"]*\)"$/\1/p' "$source_config" | head -1)"
            sed -i -E \
              -e '/^CONFIG_TARGET_[^=]+_DEVICE_[^=]+=y$/d' \
              -e '/^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=/d' \
              "$source_config"
            if [ -n "$target_board" ]; then
              sed -i "/^CONFIG_TARGET_${target_board}=y$/d" "$source_config"
            fi
            if [ -n "$target_board" ] && [ -n "$target_subtarget" ]; then
              sed -i "/^CONFIG_TARGET_${target_board}_${target_subtarget}=y$/d" "$source_config"
            fi
            install -m 0644 "$source_config" "$target_config"
            git add -- "$target_config"
          done

          if git diff --cached --quiet; then
            echo '配置没有变化，无需提交'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "ci: update ImmortalWrt device build configs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish_release:
    name: 发布 GitHub Release
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.UPLOAD_RELEASE == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载 Release 文件
        uses: actions/download-artifact@v4
        with:
          pattern: immortalwrt-${{ needs.build.outputs.device_slug }}-release-${{ github.run_id }}
          path: release-files
          merge-multiple: true

      - name: 生成校验和
        run: (cd release-files && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum) > release-files/SHA256SUMS

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ImmortalWrt 25.12 ${{ needs.build.outputs.device_name }} ${{ github.run_number }}-${{ github.run_attempt }}
          tag_name: immortalwrt-${{ needs.build.outputs.device_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          body: |
            ImmortalWrt 25.12 device firmware build.

            Build date: ${{ github.run_started_at }}
            Firmware and APK package archive are attached. SHA256SUMS contains checksums.

            Set a strong root password on first login.
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
